# Xwift Seed Node 1 - Testnet Configuration
# Role: Primary seed node for local testnet
# Network: Testnet (isolated from mainnet)

# Network Mode
testnet=1

# Data Storage
data-dir=/home/xwift/.xwift
log-file=/home/xwift/.xwift/xwift.log
log-level=1

# P2P Network Configuration
p2p-bind-ip=0.0.0.0
p2p-bind-port=29080
p2p-external-port=29080

# RPC Configuration
rpc-bind-ip=0.0.0.0
rpc-bind-port=29081
confirm-external-bind=1
rpc-login=testnet:testnet123
restricted-rpc=1

# ZMQ Configuration
zmq-rpc-bind-ip=0.0.0.0
zmq-rpc-bind-port=29099

# Peer Discovery - Connect to other testnet nodes
add-priority-node=172.25.0.11:29082
add-priority-node=172.25.0.12:29084
add-priority-node=172.25.0.13:29086

# Performance Tuning
max-concurrency=4
db-sync-mode=fast:async:250000000bytes
prep-blocks-threads=4
block-sync-size=20

# Daemon Options
non-interactive=1
no-igd=1
enable-dns-blocklist=0

# Mining Disabled (seed node only)
start-mining=
mining-threads=0

# Connection Limits
out-peers=16
in-peers=32
limit-rate-up=8192
limit-rate-down=32768

# Transaction Pool
max-txpool-weight=268435456

# Logging
log-level=1
