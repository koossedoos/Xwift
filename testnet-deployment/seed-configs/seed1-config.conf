# Xwift Testnet Seed Node 1 (Digital Ocean - NYC3)

# General
testnet=1
data-dir=/var/lib/xwift-testnet
log-file=/var/log/xwift-testnet/xwift.log
log-level=1

# Networking
p2p-bind-ip=0.0.0.0
p2p-bind-port=29080
rpc-bind-ip=0.0.0.0
rpc-bind-port=29081
zmq-pub=tcp://0.0.0.0:29082
restricted-rpc=1
confirm-external-bind=1

# Peer management
out-peers=32
in-peers=16
limit-rate-up=4096
limit-rate-down=12288

# Seed peers (update with actual hostnames/IPs)
add-priority-node=seed2.xwift-testnet.network:29080
add-priority-node=seed3.xwift-testnet.network:29080

# Performance
max-concurrency=8
block-sync-size=100

# Misc
sync-pruned-blocks=1
